<title>Mi Gym</title>
<style>
:root{--bg:#0e1014;--card:#171a21;--card2:#232834;--line:#2c3240;--txt:#eef1f6;--mut:#9aa3b2;--acc:#4ade80;--warn:#f87171;--fig:#e5e7eb;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(14,16,20,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

main{padding:14px 14px calc(env(safe-area-inset-bottom) + 160px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,23,29,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}

h2{margin:6px 0 8px;font-size:21px}
h3{margin:18px 2px 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.muted{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12.5px}.mt{margin-top:10px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:6px}

.btn.pri{background:var(--acc);color:#052e14;border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--warn);border-color:rgba(248,113,113,.4)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.full{width:100%;margin-top:10px}
.icon{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;min-width:36px;height:36px;font-size:16px;font-family:inherit}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;-webkit-overflow-scrolling:touch}

textarea{min-height:80px;resize:vertical}
.sets{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:6px;align-items:center}
.sets.one{grid-template-columns:26px 1fr 46px}
.sets input{text-align:center;padding:10px 4px}
.sn{color:var(--mut);text-align:center;font-weight:600}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:18px;font-weight:700}
.chk.on{background:var(--acc);color:#052e14;border-color:var(--acc)}
.note{margin-top:8px;padding:8px 10px;background:var(--card2);border-radius:10px;font-size:14px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}

canvas{width:100%;display:block}
.gridg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;color:var(--txt);font:inherit}
.gcard svg{width:100%;height:110px;display:block}
.gcard b{display:block;font-size:14px;margin-top:6px}.gcard small{color:var(--mut);font-size:12px}
.mini{width:56px;height:56px;flex:none;background:var(--card2);border-radius:10px}
.altrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pickrow{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:inherit;padding:8px 2px;text-align:left}
.guide-fig{background:var(--card2);border-radius:16px;margin-bottom:8px}
.guide-fig svg{width:100%;height:260px;display:block}
.tag{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mut)}
.cues{padding-left:22px}.cues li,.errs li{margin:7px 0}.errs{padding-left:22px}.errs li::marker{content:"⚠︎  "}

.linkbtn{background:none;border:0;color:var(--txt);font:inherit;font-weight:600;padding:0;text-align:left}
.rhead{width:100%;background:none;border:0;color:var(--txt);font:inherit;padding:0}
.lbl{display:block;margin:14px 0 6px;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}

#modal[hidden]{display:none}

.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}

.frow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

</head>

function lastEntry(ex){for(const s of S.sessions){const e=s.entries.find(x=>x.ex===ex);if(e)return e;}return null;}
function newEntry(ex,orig,note){const l=lastEntry(ex);return{ex,orig:orig||null,note:note||'',sets:l?l.sets.map(s=>({a:s.a?String(s.a):'',b:s.b?String(s.b):'',done:false})):[{a:'',b:'',done:false}]};}

function fmtSets(e,ex){const t=(ex&&ex.t)||'wr',u=S.unit;return e.sets.map(s=>{const a=fmtNum(num(s.a)),b=fmtNum(num(s.b));
 if(t==='wr')return`${a}${u}×${b}`;if(t==='reps')return num(s.a)>0?`${b} (+${a}${u})`:b;if(t==='carry')return`${a}${u} · ${b}m`;if(t==='hold')return`${a}s`;return`${a} min`;}).join(', ');}
function entryMetric(en,ex,m){const t=(ex&&ex.t)||'wr',ss=en.sets;
 if(t==='wr'){if(m==='e1rm')return Math.max(...ss.map(s=>e1rm(s.a,s.b)));if(m==='vol')return ss.reduce((x,s)=>x+s.a*s.b,0);return Math.max(...ss.map(s=>s.a));}
 if(t==='reps'){if(m==='vol')return ss.reduce((x,s)=>x+s.b,0);return Math.max(...ss.map(s=>s.b));}
 if(t==='cardio')return ss.reduce((x,s)=>x+s.a,0);
 return Math.max(...ss.map(s=>s.a));}

function bestOf(id){let b=null;for(const s of S.sessions)for(const en of s.entries)if(en.ex===id){const v=bestMetric(en,E[id]);if(b===null||v>b)b=v;}return b;}
function entriesOf(id){const out=[];for(let k=S.sessions.length-1;k>=0;k--){const s=S.sessions[k];s.entries.forEach(e=>{if(e.ex===id)out.push({e,d:s.date});});}return out;}

 let h=`<p class="muted sm">Elegí qué entrenás hoy. Lo que levantaste la vez anterior se carga solo.</p>`;
 S.routines.forEach(r=>{const last=S.sessions.find(s=>s.routineId===r.id);
  h+=`<div class="card"><div class="row between gap"><div class="grow"><b>${esc(r.name)}</b><div class="xs muted">${r.items.map(i=>esc(E[i.ex]?.n||i.ex)).join(' · ')||'Sin ejercicios'}</div>${last?`<div class="xs muted mt">Última vez: ${fmtDate(last.date)}</div>`:''}</div><button class="btn pri" data-act="start" data-id="${r.id}">Empezar</button></div></div>`;});

}

  <div class="row gap wrap mt"><button class="btn sm" data-act="guide" data-ex="${en.ex}" data-i="${i}">📖 Cómo se hace</button><button class="btn sm" data-act="alts" data-i="${i}">🔄 Alternativas</button></div>

   r.items.forEach((it,k)=>{h+=`<div class="ritem"><div class="row between gap"><button class="linkbtn grow" data-act="guide" data-ex="${it.ex}">${esc(E[it.ex]?.n||it.ex)}</button><button class="icon" data-act="rmove" data-id="${r.id}" data-k="${k}" data-d="-1">↑</button><button class="icon" data-act="rmove" data-id="${r.id}" data-k="${k}" data-d="1">↓</button><button class="icon" data-act="rdelitem" data-id="${r.id}" data-k="${k}">✕</button></div><input value="${esc(it.note)}" data-in="rnote" data-id="${r.id}" data-k="${k}" placeholder="Nota (lo que te indicó tu entrenador)"></div>`;});

function vProgress(){
 const ss=S.sessions,now=new Date();
 const month=ss.filter(s=>{const d=new Date(s.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).length;
 const ids=[...new Set(ss.flatMap(s=>s.entries.map(e=>e.ex)))];
 let h=`<div class="stats"><div class="stat"><b>${ss.length}</b><span>entrenamientos</span></div><div class="stat"><b>${month}</b><span>este mes</span></div><div class="stat"><b>${ids.length}</b><span>ejercicios</span></div></div>`;
 if(!ss.length)return h+`<div class="card"><p>Todavía no hay entrenamientos guardados. Cuando termines el primero, acá vas a ver gráficos, tus mejores marcas y el historial.</p></div>`;
 if(!ids.includes(TS.progEx))TS.progEx=ids[0];
 const ex=E[TS.progEx]||{n:TS.progEx,t:'wr'},mets=METRICS[ex.t];
 if(!mets.find(m=>m[0]===TS.metric))TS.metric=mets[0][0];
 h+=`<div class="card"><select data-in="progex">${ids.map(id=>`<option value="${id}"${id===TS.progEx?' selected':''}>${esc(E[id]?.n||id)}</option>`).join('')}</select>
 <div class="chips">${mets.map(m=>`<button class="chip ${m[0]===TS.metric?'on':''}" data-act="metric" data-m="${m[0]}">${m[1]}</button>`).join('')}</div>
 <canvas id="chart"></canvas>${recordsHtml(TS.progEx,ex)}</div>
 <h3>Historial · ${esc(ex.n)}</h3><div class="card">${entriesOf(TS.progEx).slice(-15).reverse().map(({e,d})=>`<div class="row between gap sm" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="muted">${shortDate(d)}</span><span style="text-align:right">${fmtSets(e,ex)}</span></div>`).join('')}</div>
 <h3>Entrenamientos recientes</h3>${ss.slice(0,20).map(s=>`<div class="card"><div class="row between"><div><b>${esc(s.name)}</b><div class="xs muted">${fmtDate(s.date)} · ${fmtDur(s.dur||0)}</div></div><button class="icon" data-act="sdel" data-id="${s.id}">🗑</button></div><div class="sm mt">${s.entries.map(e=>`<div><span class="muted">${esc(E[e.ex]?.n||e.ex)}:</span> ${fmtSets(e,E[e.ex])}</div>`).join('')}</div></div>`).join('')}`;
 return h;

function recordsHtml(id,ex){const ents=entriesOf(id);if(!ents.length)return'';let items=[];
 if(ex.t==='wr'){let bw=null,be=null;ents.forEach(({e,d})=>e.sets.forEach(s=>{if(!bw||s.a>bw.v)bw={v:s.a,d,txt:`${fmtNum(s.a)} ${S.unit} × ${s.b}`};const v=e1rm(s.a,s.b);if(!be||v>be.v)be={v,d};}));
  items=[['Mayor peso',bw.txt,bw.d],['1RM estimado',`${fmtNum(be.v)} ${S.unit}`,be.d]];}
 else{let b=null;ents.forEach(({e,d})=>{const v=entryMetric(e,ex,'max');if(!b||v>b.v)b={v,d};});items=[['Mejor marca',fmtNum(b.v)+sufFor(ex.t),b.d]];}
 return`<div class="stats mt" style="grid-template-columns:repeat(${items.length},1fr);margin-bottom:0">${items.map(i=>`<div class="stat"><b style="font-size:18px">${i[1]}</b><span>🏆 ${i[0]} · ${shortDate(i[2])}</span></div>`).join('')}</div>`;}
function vGuides(){return`<input placeholder="Buscar ejercicio…" value="${esc(TS.gq)}" data-in="gq"><div class="chips">${[['all','Todos'],...Object.entries(PATTERNS)].map(([k,v])=>`<button class="chip ${k===TS.gp?'on':''}" data-act="gp" data-p="${k}">${v}</button>`).join('')}</div><div id="glist">${guideList()}</div>`;}
function guideList(){const q=norm(TS.gq);const ids=Object.keys(E).filter(id=>(TS.gp==='all'||E[id].p===TS.gp)&&(!q||norm(E[id].n).includes(q)));

/* ---------- gráfico ---------- */
function drawChart(cv,pts,suf){
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth||300,H=210;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
 const c=cv.getContext('2d');c.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);
 const acc=cs.getPropertyValue('--acc').trim(),mut=cs.getPropertyValue('--mut').trim(),line=cs.getPropertyValue('--line').trim();
 if(!pts.length)return;
 const pl=44,pr=14,pt=22,pb=26;let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
 if(mn===mx){mn=mn*.9;mx=mx*1.1||1;}const pad=(mx-mn)*.12;mn=Math.max(0,mn-pad);mx+=pad;
 const X=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
 c.font='11px -apple-system,system-ui';c.lineWidth=1;
 for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,y=Y(v);c.strokeStyle=line;c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();c.fillStyle=mut;c.textAlign='right';c.fillText(fmtNum(v),pl-6,y+4);}
 c.textAlign='left';c.fillText(shortDate(pts[0].d),pl,H-8);if(pts.length>1){c.textAlign='right';c.fillText(shortDate(pts[pts.length-1].d),W-pr,H-8);}
 const path=()=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.v)):c.moveTo(X(i),Y(p.v)));};
 const g=c.createLinearGradient(0,pt,0,H-pb);g.addColorStop(0,acc+'55');g.addColorStop(1,acc+'00');
 path();c.lineTo(X(pts.length-1),H-pb);c.lineTo(X(0),H-pb);c.closePath();c.fillStyle=g;c.fill();
 path();c.strokeStyle=acc;c.lineWidth=2.5;c.stroke();
 c.fillStyle=acc;pts.forEach((p,i)=>{c.beginPath();c.arc(X(i),Y(p.v),3.5,0,7);c.fill();});
 const L=pts[pts.length-1];c.fillStyle='#fff';c.textAlign='right';c.font='600 12px -apple-system,system-ui';c.fillText(fmtNum(L.v)+suf,W-pr,Math.max(12,Y(L.v)-9));
}

/* ---------- descanso, sonido y pantalla ---------- */
let restEnd=0,restInt=null,actx=null,wakeLock=null;
function ensureAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){if(navigator.vibrate)navigator.vibrate([200,100,200]);if(!actx)return;[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22);});}
function startRest(){restEnd=Date.now()+S.rest*1000;const b=$('#restbar');b.hidden=false;b.classList.remove('done');clearInterval(restInt);restInt=setInterval(tickRest,250);tickRest();}
function tickRest(){const left=Math.ceil((restEnd-Date.now())/1000),el=$('#restTime');
 if(left<=0){el.textContent='¡A la próxima serie!';$('#restbar').classList.add('done');clearInterval(restInt);restInt=null;beep();setTimeout(()=>{if(!restInt)$('#restbar').hidden=true;},6000);return;}
 el.textContent=fmtClock(left);}
function stopRest(){clearInterval(restInt);restInt=null;$('#restbar').hidden=true;}
async function requestWake(){if(!S.wake||!S.active||!('wakeLock' in navigator))return;try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){try{if(wakeLock)wakeLock.release();}catch(e){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.active)requestWake();});

/* ---------- documentos (IndexedDB) ---------- */
let dbp=null;
const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('migym_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files',mode),r=fn(tx.objectStore('files'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});}
const fAll=()=>idb('readonly',s=>s.getAll()),fPut=o=>idb('readwrite',s=>s.put(o)),fDel=id=>idb('readwrite',s=>s.delete(id)),fGet=id=>idb('readonly',s=>s.get(id));
function guessType(n){n=n.toLowerCase();if(n.endsWith('.pdf'))return'application/pdf';if(n.endsWith('.md')||n.endsWith('.txt'))return'text/plain';if(n.endsWith('.html'))return'text/html';return'application/octet-stream';}
async function loadFiles(){const box=$('#flist');if(!box)return;try{const fs=(await fAll()).sort((a,b)=>b.added-a.added);
 box.innerHTML=fs.length?fs.map(f=>`<div class="frow"><span style="font-size:24px">${f.type.includes('pdf')?'📄':f.type.startsWith('image')?'🖼️':'📝'}</span><div class="grow"><b class="sm" style="word-break:break-word">${esc(f.name)}</b><div class="xs muted">${fmtSize(f.size)} · ${shortDate(new Date(f.added).toISOString())}</div></div><button class="btn sm" data-act="fopen" data-id="${f.id}">Abrir</button><button class="icon" data-act="fdel" data-id="${f.id}">✕</button></div>`).join(''):'<p class="muted sm">Todavía no agregaste documentos.</p>';}
 catch(e){box.innerHTML='<p class="muted sm">No se pudo acceder al almacenamiento de documentos.</p>';}}
async function addFiles(e){for(const f of [...e.target.files]){const buf=await f.arrayBuffer();await fPut({id:uid(),name:f.name,type:f.type||guessType(f.name),size:f.size,added:Date.now(),buf});}e.target.value='';loadFiles();}

 guide:t=>{const i=t.dataset.i;openGuide(t.dataset.ex,(i!==undefined&&S.active&&S.active.entries[+i])?+i:null);},
 alts:t=>{const i=+t.dataset.i,en=S.active.entries[i],base=en.orig||en.ex;const list=[...(en.ex!==base?[base]:[]),...(E[base]?.alt||[]).filter(a=>a!==en.ex&&E[a])];
  openModal(`<h2>Alternativas</h2><p class="muted sm">Si ${esc(E[base]?.n)} está ocupado, elegí otra opción que trabaja algo parecido. Se guarda con su propio nombre para que tu progreso quede ordenado.</p>${list.map(a=>altRow(a,i)).join('')}<button class="btn ghost full" data-act="close">Cerrar</button>`);},
 swap:t=>{const i=+t.dataset.i,a=t.dataset.ex,en=S.active.entries[i],orig=en.orig||en.ex;S.active.entries[i]=newEntry(a,a===orig?null:orig,en.note);save();closeModal();render();},
 pick:t=>{const cb=pickCb;pickCb=null;closeModal();if(cb)cb(t.dataset.ex);},
 finish:()=>{const W=S.active;
  const entries=W.entries.map(en=>({ex:en.ex,orig:en.orig,sets:en.sets.filter(s=>num(s.a)>0||num(s.b)>0).map(s=>({a:num(s.a),b:num(s.b)}))})).filter(en=>en.sets.length);
  if(!entries.length){if(confirm('No cargaste ninguna serie. ¿Descartar el entrenamiento?')){S.active=null;save();releaseWake();stopRest();render();}return;}
  const prs=entries.filter(en=>{const prev=bestOf(en.ex);return prev!==null&&bestMetric(en,E[en.ex])>prev;}).map(en=>en.ex);
  const sess={id:W.id,date:new Date().toISOString(),routineId:W.routineId,name:W.name,dur:Date.now()-W.start,entries};
  S.sessions.unshift(sess);S.active=null;save();releaseWake();stopRest();render();window.scrollTo(0,0);
  openModal(`<h2>¡Entrenamiento guardado! 💪</h2><p class="muted">${entries.length} ejercicios · ${fmtDur(sess.dur)}</p>${prs.length?`<div class="card hl"><b>🏆 Mejores marcas nuevas</b><ul>${prs.map(x=>`<li>${esc(E[x]?.n||x)}</li>`).join('')}</ul></div>`:''}<p>Viniste y lo hiciste: eso es lo que más cuenta. Mirá tu evolución en <b>Progreso</b>.</p><button class="btn pri full" data-act="close">Listo</button>`);},
 discard:()=>{if(confirm('¿Descartar este entrenamiento? No se va a guardar.')){S.active=null;save();releaseWake();stopRest();render();}},
 restAdd:t=>{restEnd=Math.max(restEnd,Date.now())+(+t.dataset.s)*1000;$('#restbar').classList.remove('done');$('#restbar').hidden=false;if(!restInt)restInt=setInterval(tickRest,250);tickRest();},
 restStop:stopRest,
 ropen:t=>{TS.openR=TS.openR===t.dataset.id?null:t.dataset.id;render();},
 rmove:t=>{const r=S.routines.find(x=>x.id===t.dataset.id),k=+t.dataset.k,j=k+ +t.dataset.d;if(r&&j>=0&&j<r.items.length){[r.items[k],r.items[j]]=[r.items[j],r.items[k]];save();render();}},
 rdelitem:t=>{const r=S.routines.find(x=>x.id===t.dataset.id);if(r){r.items.splice(+t.dataset.k,1);save();render();}},
 raddex:t=>{const r=S.routines.find(x=>x.id===t.dataset.id);openPicker(ex=>{r.items.push({ex,note:''});save();render();});},
 rdel:t=>{if(confirm('¿Eliminar esta rutina? Tu historial no se borra.')){S.routines=S.routines.filter(x=>x.id!==t.dataset.id);save();render();}},
 rnew:()=>{const r={id:uid(),name:'Nueva rutina',items:[]};S.routines.push(r);TS.openR=r.id;save();render();},
 metric:t=>{TS.metric=t.dataset.m;render();},
 gp:t=>{TS.gp=t.dataset.p;render();},
 sdel:t=>{if(confirm('¿Borrar este entrenamiento del historial?')){S.sessions=S.sessions.filter(s=>s.id!==t.dataset.id);save();render();}},
 fopen:async t=>{const f=await fGet(t.dataset.id);if(!f)return;const blob=new Blob([f.buf],{type:f.type});curUrl=URL.createObjectURL(blob);curFile=new File([f.buf],f.name,{type:f.type});
  const share=navigator.canShare&&navigator.canShare({files:[curFile]})?`<button class="btn full" data-act="fshare">Compartir / abrir en otra app</button>`:'';let body='';
  if(f.type.startsWith('image/'))body=`<img class="doc" src="${curUrl}" alt="">`;
  else if(f.type==='application/pdf')body=`<a class="btn pri full" href="${curUrl}" target="_blank">Abrir PDF a pantalla completa</a>${share}<p class="xs muted mt">Vista previa (en iPhone a veces muestra solo la primera página):</p><iframe class="doc" src="${curUrl}"></iframe>`;
  else if(f.type.startsWith('text/')&&f.type!=='text/html')body=`<pre class="doc">${esc(await blob.text())}</pre>`;
  else body=`<a class="btn pri full" href="${curUrl}" target="_blank">Abrir archivo</a>${share}`;
  openModal(`<h2 style="word-break:break-word">${esc(f.name)}</h2>${body}<button class="btn ghost full" data-act="close">Cerrar</button>`);},
 fshare:()=>{if(curFile)navigator.share({files:[curFile]}).catch(()=>{});},
 fdel:async t=>{if(!confirm('¿Borrar este documento del iPhone?'))return;await fDel(t.dataset.id);loadFiles();},
 settings:()=>openModal(`<h2>Ajustes</h2>
  <label class="lbl">Unidad de peso</label><div class="seg">${['kg','lb'].map(u=>`<button class="chip ${S.unit===u?'on':''}" data-act="setunit" data-u="${u}">${u}</button>`).join('')}</div>
  <p class="xs muted">Cambiar la unidad no convierte los registros ya guardados.</p>
  <label class="lbl">Descanso entre series</label><div class="seg">${[60,90,120,180].map(s=>`<button class="chip ${S.rest===s?'on':''}" data-act="setrest" data-s="${s}">${fmtClock(s)}</button>`).join('')}</div>
  <label class="lbl">Pantalla encendida mientras entrenás</label><div class="seg"><button class="chip ${S.wake?'on':''}" data-act="setwake" data-v="1">Sí</button><button class="chip ${!S.wake?'on':''}" data-act="setwake" data-v="0">No</button></div>
  <h3>Copia de seguridad</h3><p class="xs muted">Incluye rutinas, entrenamientos y registros (los documentos no). Conviene hacerla de vez en cuando.</p>
  <button class="btn full" data-act="export">Exportar copia</button><label class="btn full">Importar copia<input type="file" id="impIn" accept=".json,application/json" hidden></label>
  <button class="btn danger full" data-act="wipe">Borrar todos los datos</button><button class="btn ghost full" data-act="close">Cerrar</button>`,()=>$('#impIn').addEventListener('change',importData)),
 setunit:t=>{S.unit=t.dataset.u;save();render();ACT.settings();},
 setrest:t=>{S.rest=+t.dataset.s;save();ACT.settings();},
 setwake:t=>{S.wake=t.dataset.v==='1';save();if(S.wake)requestWake();else releaseWake();ACT.settings();},
 export:()=>{const name=`migym-copia-${new Date().toISOString().slice(0,10)}.json`,file=new File([JSON.stringify(Object.assign({},S,{active:null}))],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);},
 wipe:()=>{if(confirm('¿Borrar rutinas, entrenamientos y registros? No se puede deshacer.')&&confirm('¿Seguro?')){S=defaults();save();stopRest();closeModal();render();}},
 pausetool:()=>openModal(`<h2>🌿 Pausa guiada</h2>
  <p class="sm muted">Un impulso es como una ola: sube, llega a un pico y baja. No hace falta hacerle caso para que pase.</p>
  <ol class="cues"><li><b>Chequeá el hambre.</b> Si apareció de a poco y cualquier comida te vendría bien, probablemente es hambre física: comé tranquilo y sentado. Si apareció de golpe y pide algo puntual, seguí con los pasos.</li>
  <li><b>Ponele nombre a lo que sentís:</b> estrés, cansancio, soledad, aburrimiento, enojo…</li>
  <li><b>Cambiá de lugar</b> y arrancá el temporizador.</li>
  <li><b>Elegí algo que te dé un alivio parecido:</b> una ducha caliente, música, escribir, llamar a alguien, salir a caminar.</li></ol>
  <div class="card"><div class="bigclock" id="pclock">--:--</div><div class="row gap"><button class="btn grow" data-act="pstart" data-m="10">10 min</button><button class="btn grow" data-act="pstart" data-m="15">15 min</button></div></div>
  <div class="card"><div class="bwrap"><div id="bcirc"></div><div id="btext" class="mt sm muted">Respiración 4 · 7 · 8</div></div><button class="btn full" data-act="breath">Empezar respiración</button></div>
  <div class="card"><b>Mientras tanto</b>${['Me fui de la cocina o cambié de ambiente','Tomé agua o un té despacio','Hice algo con las manos o con la cabeza','Me hablé con la amabilidad con la que le hablaría a un amigo'].map(c=>`<label class="check"><input type="checkbox"><span class="sm">${c}</span></label>`).join('')}</div>
  <p class="xs muted">Si te pasa seguido o te cuesta mucho, contalo en tu próxima consulta con tu psicólogo/a o tu equipo. Es información valiosa, no un fracaso.</p>
  <button class="btn full" data-act="jnew">Anotar este momento</button><button class="btn ghost full" data-act="close">Cerrar</button>`),
 pstart:t=>{ensureAudio();pauseEnd=Date.now()+(+t.dataset.m)*60000;clearInterval(pauseInt);
  const tick=()=>{const el=$('#pclock');if(!el){clearInterval(pauseInt);return;}const left=Math.ceil((pauseEnd-Date.now())/1000);
   if(left<=0){clearInterval(pauseInt);el.textContent='Listo';beep();el.insertAdjacentHTML('afterend','<p class="sm" style="text-align:center">Fijate cómo está el impulso ahora. Pase lo que pase después, ya te diste un espacio, y eso cuenta.</p>');return;}
   el.textContent=fmtClock(left);};pauseInt=setInterval(tick,500);tick();},
 breath:t=>{const c=$('#bcirc'),tx=$('#btext');if(breathT){clearTimeout(breathT);breathT=null;t.textContent='Empezar respiración';c.style.transition='transform .6s';c.style.transform='scale(.45)';tx.textContent='Respiración 4 · 7 · 8';return;}
  t.textContent='Detener';const ph=[['Inhalá',4,1],['Sostené',7,1],['Exhalá',8,.45]];let i=0;
  const step=()=>{if(!c.isConnected){breathT=null;return;}const[w,s,sc]=ph[i];tx.textContent=`${w} · ${s} s`;c.style.transition=`transform ${s}s ease-in-out`;c.style.transform=`scale(${sc})`;i=(i+1)%3;breathT=setTimeout(step,s*1000);};step();},
 jnew:()=>{stopPauseTimers();openModal(`<h2>Anotar un momento</h2><label class="lbl">¿Qué sentías?</label><div class="seg">${['Estrés','Ansiedad','Cansancio','Aburrimiento','Soledad','Tristeza','Enojo','Otro'].map(e=>`<button class="chip" data-act="jemo">${e}</button>`).join('')}</div>
  <label class="lbl">¿Qué estaba pasando?</label><textarea id="jctx" placeholder="Dónde estaba, qué pasó antes…"></textarea>
  <label class="lbl">¿Qué hice en su lugar o qué me ayudó?</label><textarea id="jalt" placeholder="Ej: salí a caminar, llamé a alguien…"></textarea>
  <button class="btn pri full" data-act="jsave">Guardar</button><button class="btn ghost full" data-act="close">Cancelar</button>`);},
 jemo:t=>t.classList.toggle('on'),
 jsave:()=>{const emo=[...document.querySelectorAll('#mbody .chip.on')].map(b=>b.textContent),ctx=$('#jctx').value.trim(),alt=$('#jalt').value.trim();
  if(emo.length||ctx||alt){S.journal.unshift({id:uid(),date:new Date().toISOString(),emo,ctx,alt});save();}closeModal();if(tab==='read')render();},
 jdel:t=>{if(confirm('¿Borrar esta nota?')){S.journal=S.journal.filter(j=>j.id!==t.dataset.id);save();render();}}
};
let pauseInt=null,breathT=null,pauseEnd=0;
function stopPauseTimers(){clearInterval(pauseInt);pauseInt=null;clearTimeout(breathT);breathT=null;}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.routines)||!Array.isArray(d.sessions))throw 0;
 if(!confirm('Esto reemplaza tus datos actuales por los de la copia. ¿Seguir?'))return;S=Object.assign(defaults(),d,{active:null});save();closeModal();render();alert('Copia importada.');}catch(err){alert('El archivo no parece una copia válida.');}};r.readAsText(f);}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{if(e.target.id==='modal'){closeModal();return;}const t=e.target.closest('[data-act]');if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t,e);});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.in==='set'&&S.active){const s=S.active.entries[+d.i]?.sets[+d.j];if(s){s[d.f]=t.value;save();}}
 else if(d.in==='rname'){const r=S.routines.find(x=>x.id===d.id);if(r){r.name=t.value;save();}}
 else if(d.in==='rnote'){const r=S.routines.find(x=>x.id===d.id);if(r&&r.items[+d.k]){r.items[+d.k].note=t.value;save();}}
 else if(d.in==='gq'){TS.gq=t.value;$('#glist').innerHTML=guideList();}});
document.addEventListener('change',e=>{if(e.target.dataset.in==='progex'){TS.progEx=e.target.value;render();}});
window.addEventListener('resize',()=>{if(tab==='progress')drawProg();});
setInterval(()=>{const el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-S.active.start);},1000);

/* ---------- ícono para la pantalla de inicio ---------- */
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0e1014';x.fillRect(0,0,180,180);x.fillStyle='#4ade80';x.fillRect(40,84,100,12);[[28,60,16,60],[46,70,14,40],[136,60,16,60],[120,70,14,40]].forEach(r=>x.fillRect(...r));const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}})();

render();
if(S.active)requestWake();
</script>
</body>
</html>
