<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<meta name="theme-color" content="#0e1014">
<title>Mi Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<!--
  MI GYM v2 — MAPA DEL PROYECTO
  index.html            estructura + estilos (este archivo)
  manifest.webmanifest  datos de instalación
  sw.js                 modo sin conexión. ⚠ Subí VERSION cada vez que cambies cualquier archivo.
  data.js               EJ (ejercicios), ANIMS (poses), RUTINAS_BASE, PLANTILLAS, PAUSA, GRUPOS
  anim.js               Anim.montar(contenedor, claveAnim) → {parar()} · Anim.detenerTodo()
  store.js              Store (estado, cargar, guardar, exportar, importar, migrarV1, reiniciar)
                        Docs (IndexedDB para PDFs: listar, agregar, abrir, borrar)
  app.js                interfaz: pestañas Entrenar · Rutinas · Progreso · Guías · Lectura + Ajustes
  Contenedores: #app (pantalla), #nav (pestañas), #aviso (banners), #timer, #modal, #toast
-->
<style>
:root{
--bg:#f4f5f7;--cd:#ffffff;--cd2:#eef0f3;--bd:#d9dde3;--tx:#14161a;--mu:#596170;
--ac:#c2410c;--acl:#fff0e6;--ok:#13804f;--okl:#e3f6ec;--wa:#7a5600;--wal:#fff5d6;--rd:#b4233a;--rdl:#fde8eb;
--ink:#ffffff;--fig:#b9c0cc;--fig2:#dfe3ea;--musc:#ff7a1a;--sh:0 1px 3px rgba(0,0,0,.08);--r:14px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{
--bg:#0e1014;--cd:#181b21;--cd2:#21252d;--bd:#2d323c;--tx:#f2f4f7;--mu:#a5adba;
--ac:#ff8a3d;--acl:#3a2414;--ok:#4cd39b;--okl:#13301f;--wa:#ffd166;--wal:#3a3010;--rd:#ff6b81;--rdl:#3d1820;
--ink:#111111;--fig:#5d6676;--fig2:#373e4a;--musc:#ff8a3d;--sh:0 1px 3px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(78px + var(--sab))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Cabecera y navegación */
.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--sat)) 14px 8px;background:var(--bg);border-bottom:1px solid var(--bd)}
.hdr h1{font-size:19px;font-weight:800}
.icon-btn{background:none;border:none;font-size:22px;width:44px;height:44px;border-radius:12px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;max-width:560px;margin:0 auto;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:var(--sab)}
.nav button{flex:1;border:none;background:none;min-height:58px;padding:6px 0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button .ico{font-size:21px;line-height:1}
.nav button.on{color:var(--ac);font-weight:700}
/* Bloques */
.sec{padding:14px 14px 22px}
.tit{font-size:23px;font-weight:800;margin-bottom:3px}
.sub{font-size:14px;color:var(--mu);margin-bottom:14px}
.mu{color:var(--mu)}.peq{font-size:13px}.neg{font-weight:700}
.lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin:18px 0 8px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--cd2);font-weight:700;font-size:15px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.btn.peligro{background:var(--rdl);border-color:var(--rd);color:var(--rd)}
.btn.ghost{background:none;border-color:transparent;color:var(--ac)}
.btn.chico{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--bd);background:var(--cd);font-size:13px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--cd2);color:var(--mu)}
.tag.ac{background:var(--acl);color:var(--ac)}.tag.ok{background:var(--okl);color:var(--ok)}.tag.wa{background:var(--wal);color:var(--wa)}.tag.rd{background:var(--rdl);color:var(--rd)}
/* Listas */
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--bd);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:last-child{border-bottom:none}
.item .ico{width:42px;height:42px;border-radius:12px;background:var(--acl);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item .txt{flex:1;min-width:0}.item .t1{font-weight:700}.item .t2{font-size:13px;color:var(--mu)}
/* Campos (16px evita el zoom automático de iOS) */
.inp{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd2);font-size:16px}
textarea.inp{min-height:76px;resize:vertical}
.inp.mini{width:70px;text-align:center;font-weight:700}
/* Entrenamiento */
.ej-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ej-nom{font-size:17px;font-weight:800}
.presc{font-size:13px;color:var(--mu);margin-top:2px}
.sug{margin:10px 0;padding:9px 11px;border-radius:10px;background:var(--acl);font-size:14px;border-left:3px solid var(--ac)}
.sug.wa{background:var(--wal);border-left-color:var(--wa)}
.set-row{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px;border-radius:10px;margin-bottom:4px}
.set-row.hd{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;text-align:center;margin:6px 0 0}
.set-row.ok{background:var(--okl)}
.set-n{text-align:center;font-weight:800;color:var(--mu)}
.set-row .inp{text-align:center;font-weight:800;font-size:18px;padding:6px}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--cd2);font-size:18px;font-weight:800;color:var(--mu)}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.warmup{background:var(--cd2);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.warmup div{display:flex;justify-content:space-between;padding:3px 0}
.prog{display:flex;gap:3px;margin:8px 0 12px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.prog i.on{background:var(--ok)}
.seg3{display:flex;gap:6px}.seg3 button{flex:1}
/* Temporizador */
.timer-pill{position:fixed;right:14px;bottom:calc(88px + var(--sab));z-index:70;display:flex;align-items:center;gap:10px;background:var(--cd);border:2px solid var(--ac);border-radius:30px;padding:6px 6px 6px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer-pill.fin{border-color:var(--ok);animation:pulso .7s ease 3}
.timer-pill b{font-size:22px;font-variant-numeric:tabular-nums}
@keyframes pulso{50%{transform:scale(1.07)}}
/* Modal */
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(20px + var(--sab))}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
/* Animaciones */
.anim-box{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:8px}
.anim-box svg{width:100%;height:auto;display:block;max-height:46dvh}
.anim-fase{text-align:center;font-weight:800;font-size:15px;color:var(--ac);min-height:22px;margin-top:4px}
.anim-ctrl{display:flex;gap:8px;justify-content:center;margin-top:8px}
/* Progreso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 6px;text-align:center}
.stat-n{font-size:22px;font-weight:800;color:var(--ac)}.stat-l{font-size:11px;color:var(--mu);margin-top:2px}
.bar-row{margin-bottom:12px}.bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar-track{height:9px;background:var(--cd2);border-radius:5px;overflow:hidden}.bar-fill{height:100%;background:var(--ac);border-radius:5px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-c{aspect-ratio:1;border-radius:6px;background:var(--cd2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mu)}
.hm-c.f{background:var(--ac);color:var(--ink);font-weight:800}
.hm-c.c{background:var(--okl);color:var(--ok);font-weight:800}
.hm-c.hoy{outline:2px solid var(--ac);outline-offset:-2px}
.chart svg{width:100%;height:auto;display:block}
/* Lectura / pausa guiada */
.respira{width:150px;height:150px;border-radius:50%;background:var(--acl);border:3px solid var(--ac);margin:18px auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ac);animation:respirar 10s ease-in-out infinite}
@keyframes respirar{0%,100%{transform:scale(.72)}40%{transform:scale(1)}}
/* Varios */
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty .e-ico{font-size:32px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translate(-50%,20px);opacity:0;z-index:100;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.aviso{margin:10px 14px 0;padding:11px 13px;border-radius:12px;font-size:14px;background:var(--wal);color:var(--wa);border:1px solid var(--wa)}
.aviso.rd{background:var(--rdl);color:var(--rd);border-color:var(--rd)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){.respira,.timer-pill.fin{animation:none}}
</style>
</head>
<body>
<header class="hdr">
  <h1 id="hdr-titulo">Mi Gym</h1>
  <button id="btn-ajustes" class="icon-btn" aria-label="Ajustes">⚙️</button>
</header>
<div id="aviso"></div>
<main id="app"><div class="empty"><div class="e-ico">🏋️</div>Cargando…</div></main>
<nav id="nav" class="nav" aria-label="Secciones"></nav>
<div id="timer"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div class="aviso rd">La app necesita JavaScript activado.</div></noscript>
<script src="data.js"></script>
<script src="anim.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
